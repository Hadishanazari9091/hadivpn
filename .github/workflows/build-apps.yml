name: Build Hadex VPN apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "windows-app/**"
      - "android-app/**"
      - ".github/workflows/build-apps.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        working-directory: windows-app
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check tailscale.cjs
          node --check renderer.js
      - name: Install and package Windows app
        working-directory: windows-app
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: hadex-vpn-windows-installer
          path: windows-app/dist/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android debug APK
        run: gradle -p android-app assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hadex-vpn-android-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
