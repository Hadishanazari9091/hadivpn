name: Tailscale Exit Node

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exit-node:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Enable IP forwarding
        shell: bash
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1

      - name: Connect to Tailscale and advertise exit node
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --advertise-exit-node
          log-mode: normal

      - name: Verify exit-node advertisement
        shell: bash
        run: |
          echo "Tailscale status:"
          tailscale status
          echo
          echo "Runner Tailscale IPv4:"
          tailscale ip -4
          echo
          echo "IP forwarding:"
          sysctl net.ipv4.ip_forward
          sysctl net.ipv6.conf.all.forwarding

      - name: Diagnose runner internet and NAT
        shell: bash
        run: |
          echo "===== PUBLIC IPv4 ====="
          curl -4 --max-time 15 -sS https://api.ipify.org || true
          echo
          echo "===== DEFAULT ROUTE ====="
          ip route
          echo
          echo "===== IP FORWARDING ====="
          sysctl net.ipv4.ip_forward
          sysctl net.ipv6.conf.all.forwarding
          echo
          echo "===== NAT POSTROUTING ====="
          sudo iptables -t nat -L POSTROUTING -n -v || true
          echo
          echo "===== TAILSCALE NAT CHAIN ====="
          sudo iptables -t nat -L ts-postrouting -n -v || true
          echo
          echo "===== FORWARD CHAIN ====="
          sudo iptables -L FORWARD -n -v || true
          echo
          echo "===== TAILSCALE FORWARD CHAIN ====="
          sudo iptables -L ts-forward -n -v || true
          echo
          echo "===== TAILSCALE FORWARD RULES ====="
          sudo iptables -S ts-forward || true
          echo
          echo "===== INTERNET HTTPS TEST ====="
          curl -I -4 --max-time 15 https://1.1.1.1 || true

      - name: Keep exit node online and monitor traffic
        shell: bash
        run: |
          echo "Exit node online. Use it from the Windows client, then inspect these counters."
          while true; do
            sleep 60
            echo
            echo "===== LIVE TAILSCALE FORWARD COUNTERS ====="
            sudo iptables -L ts-forward -n -v || true
            echo
            echo "===== LIVE TAILSCALE NAT COUNTERS ====="
            sudo iptables -t nat -L ts-postrouting -n -v || true
            echo
            echo "===== TAILSCALE STATUS ====="
            tailscale status
          done
